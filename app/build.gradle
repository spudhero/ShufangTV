plugins { id 'com.android.application' }

android {
    namespace 'io.github.spudhero.shufangtv'
    compileSdk 36
    buildToolsVersion '36.0.0'
    ndkVersion '27.2.12479018'
    if (rootProject.file('.build-cache/toolchain/android-ndk-r27c').isDirectory()) {
        ndkPath rootProject.file('.build-cache/toolchain/android-ndk-r27c').absolutePath
    }
    defaultConfig {
        applicationId 'io.github.spudhero.shufangtv'
        minSdk 26
        targetSdk 36
        versionCode 8
        versionName '0.5.0-alpha.1'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        ndk { abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        debug {
            def qaKey = providers.gradleProperty('shufang.debugKeystore').orNull
            if (qaKey != null) {
                signingConfigs.debug.storeFile = file(qaKey)
                signingConfigs.debug.storePassword = 'android'
                signingConfigs.debug.keyAlias = 'androiddebugkey'
                signingConfigs.debug.keyPassword = 'android'
            }
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    lint { abortOnError true; disable 'GradleDependency', 'NewerVersionAvailable', 'OldTargetApi' }
    testOptions { unitTests.includeAndroidResources = true }
    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }
    packaging { resources.excludes += ['META-INF/DEPENDENCIES', 'META-INF/INDEX.LIST', 'META-INF/versions/**'] }
}

def prepareSpeechRuntime = tasks.register('prepareSpeechRuntime', Exec) {
    workingDir rootProject.projectDir
    commandLine 'python3', rootProject.file('scripts/prepare-speech-runtime.py').absolutePath
    inputs.file rootProject.file('scripts/prepare-speech-runtime.py')
    outputs.files(['armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'].collectMany { abi ->
        ['libsherpa-onnx-c-api.so', 'libonnxruntime.so'].collect { lib ->
            rootProject.file(".build-cache/speech/runtime-1.12.21/jniLibs/${abi}/${lib}")
        }
    })
}
def prepareSpeechNotices = tasks.register('prepareSpeechNotices', Sync) {
    from(rootProject.file('third_party/sherpa-onnx')) {
        include 'README.md', 'LICENSE', 'MODEL-LICENSE', 'ONNXRUNTIME-LICENSE'
        into 'speech/licenses'
    }
    into layout.buildDirectory.dir('generated/speech-assets')
}
android.sourceSets.main.assets.srcDir(layout.buildDirectory.dir('generated/speech-assets'))
tasks.configureEach { task ->
    if (task.name == 'preBuild' || task.name.startsWith('configureCMake') || task.name.startsWith('buildCMake')) {
        task.dependsOn prepareSpeechRuntime
    }
    if (task.name == 'preBuild' || task.name.endsWith('Assets')) {
        task.dependsOn prepareSpeechNotices
    }
}

dependencies {
    implementation project(':core')
    implementation 'com.hierynomus:smbj:0.14.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.apache.commons:commons-compress:1.27.1'
    implementation 'org.slf4j:slf4j-nop:2.0.16'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.81'
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'com.caverock:androidsvg-aar:1.4'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.16'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'junit:junit:4.13.2'
}

tasks.withType(Test).configureEach {
    // Keep Robolectric's downloaded Android runtime and lock inside disposable build output.
    def testHome = layout.buildDirectory.dir('test-home').get().asFile
    systemProperty 'user.home', testHome.absolutePath
    systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
    System.properties.findAll { key, value -> key.toString().startsWith('robolectric.') }.each { key, value ->
        systemProperty key.toString(), value
    }
    doFirst { testHome.mkdirs() }
}
