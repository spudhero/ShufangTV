name: Android CI and signed APK

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['docs/**', 'design/**', '**/*.md']
  pull_request:
    branches: [main]
    paths-ignore: ['docs/**', 'design/**', '**/*.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require release tags to belong to main
        if: startsWith(github.ref, 'refs/tags/v')
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Install Android toolchain
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Test, lint and build debug
        run: ./gradlew :core:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --console=plain
      - name: Build release
        if: github.event_name != 'pull_request' && github.repository == 'spudhero/ShufangTV' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        run: ./gradlew :app:lintRelease :app:assembleRelease --console=plain
      - name: Sign and verify release APK
        if: github.event_name != 'pull_request' && github.repository == 'spudhero/ShufangTV' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64, json, os, subprocess
          from pathlib import Path
          os.umask(0o077)
          key = Path(os.environ['RUNNER_TEMP']) / 'shufangtv-release.p12'
          try:
              encoded = os.environ['ANDROID_RELEASE_KEYSTORE_BASE64']
              if not encoded:
                  raise SystemExit('Configure the four ANDROID_RELEASE_* repository secrets first.')
              key.write_bytes(base64.b64decode(encoded, validate=True))
              env = os.environ.copy()
              env.pop('ANDROID_RELEASE_KEYSTORE_BASE64', None)
              env['ANDROID_RELEASE_KEYSTORE_PATH'] = str(key)
              subprocess.run(['python3', 'scripts/package-release.py'], env=env, check=True)
              metadata = json.loads(Path('artifacts/release/release-metadata.json').read_text())
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
                  summary.write('Signed APK built and verified. Download the release artifact below.\n\n')
                  summary.write('```json\n' + json.dumps(metadata, indent=2) + '\n```\n')
          finally:
              key.unlink(missing_ok=True)
          PY
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/shufangtv-release.p12"
      - name: Upload signed release
        if: success() && github.event_name != 'pull_request' && github.repository == 'spudhero/ShufangTV' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ShufangTV-release-${{ github.sha }}
          path: artifacts/release/
          if-no-files-found: error
          retention-days: 90
      - name: Upload debug APK and reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ShufangTV-debug-and-reports-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/reports/
            core/build/reports/tests/
            app/build/qa/
            app/build/display-qa/
